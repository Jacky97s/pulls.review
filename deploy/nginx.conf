server {
  listen 80;
  root /usr/share/nginx/html;

  # Every route (/gl/..., /gh/..., /oauth/gitlab) is the SPA's: serve index.html for
  # anything that isn't a file, as vercel.json's rewrite does.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build output never changes under its name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # A stale index.html would point at assets a new deploy removed.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }
}
