services:
  pulls-review:
    build:
      context: .
      target: site
      args:
        # e.g. gitlab1.program.com.tw=<Application ID>; the Application's redirect URI
        # must include <this site's origin>/oauth/gitlab.
        VITE_GITLAB_OAUTH_CLIENTS: ${VITE_GITLAB_OAUTH_CLIENTS:-}
        # e.g. GIT_SHA=$(git rev-parse --short HEAD) docker compose build
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - '${PORT:-8080}:80'
    restart: unless-stopped

  nginx-https:
    build:
      context: .
      dockerfile: deploy/nginx-https.Dockerfile
    profiles:
      - https
    depends_on:
      - pulls-review
    ports:
      - '${HTTPS_PORT:-8443}:443'
    environment:
      HTTPS_IP: ${HTTPS_IP:-10.0.0.89}
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
